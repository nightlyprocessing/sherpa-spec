[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sherpa-security"
version = "0.1.0"
description = "Fail-closed verification and loading for SherpaMD artifacts"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
sherpa-verify = "sherpa_security.cli:main"

[tool.setuptools]
packages = ["sherpa_security"]
